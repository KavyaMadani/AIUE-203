<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Events</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button
        id="menuButton"
        type="button"
        aria-expanded="false">

        ☰ Menu

    </button>

    <nav
        id="mainNav"
        aria-label="Main navigation">

        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Students</a>
        <a href="attendance.html">Attendance</a>
        <a href="results.html">Results</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
        <a href="login.html">Login</a>

    </nav>

    <button
        id="themeButton"
        type="button">

        🌙 Dark Mode

    </button>

</header>


<main>

    <nav aria-label="Breadcrumb">

        <a href="homepage.html">
            Home
        </a>

        <span> → Events</span>

    </nav>


    <section>

        <h2>University Events</h2>

        <p>
            Events are loaded dynamically from
            <strong>events.json</strong>
            using the Fetch API.
        </p>


        <!-- Search -->

        <label for="eventSearch">
            Search Events
        </label>

        <input
            type="search"
            id="eventSearch"
            placeholder="Search by event, description or organizer">


        <!-- Filter -->

        <label for="eventCategory">
            Filter by Category
        </label>

        <select id="eventCategory">

            <option value="All">
                All Categories
            </option>

            <option value="Workshop">
                Workshop
            </option>

            <option value="Sports">
                Sports
            </option>

            <option value="Competition">
                Competition
            </option>

            <option value="Seminar">
                Seminar
            </option>

            <option value="Social">
                Social
            </option>

            <option value="Cultural">
                Cultural
            </option>

            <option value="Exhibition">
                Exhibition
            </option>

        </select>


        <!-- Sort -->

        <label for="eventSort">
            Sort Events
        </label>

        <select id="eventSort">

            <option value="dateAsc">
                Date: Oldest First
            </option>

            <option value="dateDesc">
                Date: Newest First
            </option>

            <option value="nameAsc">
                Name: A-Z
            </option>

        </select>

    </section>


    <!-- Dynamic Data -->

    <section>

        <h2>Available Events</h2>

        <div
            id="eventsContainer"
            class="data-grid">

        </div>


        <div
            id="eventPagination"
            class="pagination">

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 StudentHub
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>

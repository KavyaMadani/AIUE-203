<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Events</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button id="menuButton" aria-expanded="false">
        ☰ Menu
    </button>

    <nav id="mainNav">

        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="attendance.html">Attendance</a>
        <a href="results.html">Results</a>
        <a href="registration.html">Register</a>
        <a href="login.html">Login</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>

    </nav>

    <button id="themeButton">🌙 Dark Mode</button>

</header>


<main>

    <section>

        <h2>Upcoming Events</h2>

        <p>
            Events are loaded from external
            <strong>events.json</strong>
            using Fetch API.
        </p>

        <div class="controls">

            <div class="control-group">

                <label for="eventSearch">
                    Search Events
                </label>

                <input
                    type="search"
                    id="eventSearch"
                    placeholder="Search events...">

            </div>


            <div class="control-group">

                <label for="eventCategory">
                    Category
                </label>

                <select id="eventCategory">
                    <option>Loading...</option>
                </select>

            </div>


            <div class="control-group">

                <label for="eventSort">
                    Sort
                </label>

                <select id="eventSort">

                    <option value="dateAsc">
                        Date: Oldest
                    </option>

                    <option value="dateDesc">
                        Date: Newest
                    </option>

                    <option value="nameAsc">
                        Name: A-Z
                    </option>

                </select>

            </div>

        </div>

    </section>


    <section>

        <div id="eventsContainer"
             class="data-grid">
        </div>

        <div id="eventPagination"
             class="pagination">
        </div>

    </section>

</main>


<footer>
    <p>© 2026 StudentHub. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>

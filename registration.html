<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button id="menuButton" aria-expanded="false">
        ☰ Menu
    </button>

    <nav id="mainNav">

        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Dashboard</a>

        <a href="feedback.html">Feedback</a>

    </nav>

    <button id="themeButton">🌙 Dark Mode</button>

</header>


<main>

    <section class="form-container">

        <h2>Student Registration Form</h2>

        <p>
            Please enter your details below.
        </p>


        <form>

            <div class="form-group">

                <label for="fullName">
                    Full Name *
                </label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address *
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="student@example.com"
                    required>

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number *
                </label>

                <input
                    id="mobile"
                    type="tel"
                    placeholder="10 digit mobile number"
                    required>

            </div>


            <div class="form-group">

                <label for="course">
                    Course *
                </label>

                <select id="course" required>

                    <option value="">
                        Select Course
                    </option>

                    <option>
                        B.Tech AI/ML
                    </option>

                    <option>
                        B.Tech CSE
                    </option>

                    <option>
                        B.Tech IT
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="regPassword">
                    Password *
                </label>

                <input
                    id="regPassword"
                    type="password"
                    required>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password *
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    required>

            </div>


            <button
                class="btn green"
                type="submit">

                Register

            </button>

        </form>

    </section>

</main>


<footer>
    <p>© 2026 StudentHub. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Students</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button
        id="menuButton"
        type="button"
        aria-expanded="false">

        ☰ Menu

    </button>

    <nav
        id="mainNav"
        aria-label="Main navigation">

        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Students</a>
        <a href="attendance.html">Attendance</a>
        <a href="results.html">Results</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
        <a href="login.html">Login</a>

    </nav>

    <button
        id="themeButton"
        type="button">

        🌙 Dark Mode

    </button>

</header>


<main>

    <nav aria-label="Breadcrumb">

        <a href="homepage.html">
            Home
        </a>

        <span> → Students</span>

    </nav>


    <section>

        <h2>Student Directory</h2>

        <p>
            Student information is loaded from
            <strong>students.json</strong>
            using Fetch API.
        </p>


        <label for="studentSearch">
            Search Students
        </label>

        <input
            type="search"
            id="studentSearch"
            placeholder="Search by name, course or city">


        <label for="studentCourse">
            Filter by Course
        </label>

        <select id="studentCourse">

            <option value="All">
                All Courses
            </option>

            <option value="B.Tech AI/ML">
                B.Tech AI/ML
            </option>

            <option value="B.Tech CSE">
                B.Tech CSE
            </option>

            <option value="B.Tech IT">
                B.Tech IT
            </option>

        </select>


        <label for="studentSort">
            Sort Students
        </label>

        <select id="studentSort">

            <option value="nameAsc">
                Name: A-Z
            </option>

            <option value="nameDesc">
                Name: Z-A
            </option>

            <option value="yearAsc">
                Year: Low to High
            </option>

        </select>

    </section>


    <section>

        <h2>Students</h2>

        <div
            id="studentsContainer"
            class="data-grid">

        </div>


        <div
            id="studentPagination"
            class="pagination">

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 StudentHub
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>

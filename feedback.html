    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button id="menuButton" type="button">
        ☰ Menu
    </button>

    <nav id="mainNav" aria-label="Main navigation">

        <a href="homepage.html">Home</a>

    </nav>

    <button id="themeButton" type="button">
        🌙 Dark Mode
    </button>

</header>


<main>

<section class="form-card">

    <h2>Student Feedback</h2>

    <form id="feedbackForm">

        <div class="form-group">

            <label for="feedbackName">
                Name
            </label>

            <input
                type="text"
                id="feedbackName"
                required>

        </div>


        <div class="form-group">

            <label for="rating">
                Rating
            </label>

            <select id="rating" required>

                <option value="">
                    Select Rating
                </option>

                <option value="5">
                    ⭐⭐⭐⭐⭐ Excellent
                </option>

                <option value="4">
                    ⭐⭐⭐⭐ Good
                </option>

                <option value="3">
                    ⭐⭐⭐ Average
                </option>

                <option value="2">
                    ⭐⭐ Poor
                </option>

                <option value="1">
                    ⭐ Very Poor
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="feedbackText">
                Feedback
            </label>

            <textarea
                id="feedbackText"
                rows="6"
                required>
            </textarea>

        </div>


        <button
            type="submit"
            class="submit-button">

            Submit Feedback

        </button>

    </form>

</section>

</main>


<footer>

</body>

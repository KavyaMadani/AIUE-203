<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - FAQ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button id="menuButton" aria-expanded="false">
        ☰ Menu
    </button>

    <nav id="mainNav">

        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="attendance.html">Attendance</a>
        <a href="results.html">Results</a>
        <a href="registration.html">Register</a>
        <a href="login.html">Login</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>

    </nav>

    <button id="themeButton">🌙 Dark Mode</button>

</header>


<main>

    <section>

        <h2>Frequently Asked Questions</h2>

        <p>
            FAQs are loaded from
            <strong>faqs.json</strong>
            using Fetch API.
        </p>


        <div class="controls">

            <div class="control-group">

                <label for="faqSearch">
                    Search FAQ
                </label>

                <input
                    id="faqSearch"
                    type="search"
                    placeholder="Search questions...">

            </div>


            <div class="control-group">

                <label for="faqCategory">
                    Category
                </label>

                <select id="faqCategory">
                    <option>Loading...</option>
                </select>

            </div>

        </div>

    </section>


    <section>

        <div id="faqContainer"
             class="faq-container">
        </div>

        <div id="faqPagination"
             class="pagination">
        </div>

    </section>

</main>


<footer>
    <p>© 2026 StudentHub. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>StudentHub - FAQ</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <h1>StudentHub</h1>

    <button
        id="menuButton"
        type="button"
        aria-expanded="false">

        ☰ Menu

    </button>

    <nav
        id="mainNav"
        aria-label="Main navigation">

        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Students</a>
        <a href="attendance.html">Attendance</a>
        <a href="results.html">Results</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
        <a href="login.html">Login</a>

    </nav>

    <button
        id="themeButton"
        type="button">

        🌙 Dark Mode

    </button>

</header>


<main>

    <nav aria-label="Breadcrumb">

        <a href="homepage.html">
            Home
        </a>

        <span> → FAQ</span>

    </nav>


    <section>

        <h2>Frequently Asked Questions</h2>

        <p>
            FAQs are loaded dynamically from
            <strong>faqs.json</strong>.
        </p>


        <label for="faqSearch">
            Search FAQs
        </label>

        <input
            type="search"
            id="faqSearch"
            placeholder="Search your question...">


        <label for="faqCategory">
            Filter by Category
        </label>

        <select id="faqCategory">

            <option value="All">
                All Categories
            </option>

            <option value="General">
                General
            </option>

            <option value="Account">
                Account
            </option>

            <option value="Academic">
                Academic
            </option>

            <option value="Events">
                Events
            </option>

            <option value="Support">
                Support
            </option>

            <option value="Students">
                Students
            </option>

        </select>

    </section>


    <section>

        <div
            id="faqContainer"
            class="faq-container">

        </div>


        <div
            id="faqPagination"
            class="pagination">

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 StudentHub
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
